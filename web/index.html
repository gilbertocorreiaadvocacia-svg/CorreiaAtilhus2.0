<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Correia Advogados · Atendimento</title>
    <meta name="theme-color" content="#0a0a09" />
    <link rel="icon" href="assets/logo.png" />
    <!-- As duas fontes do sistema sao servidas pelo proprio sistema, de
         assets/fontes, e declaradas em css/tema.css. Elas chegaram apontando
         para o Google, e nao ficaram: este sistema roda sem depender de
         servico de fora — com a internet do escritorio fora do ar a tela abre
         igual — e cada carregamento de fonte remota contaria a um terceiro que
         alguem esta usando um sistema que trata processo de cliente. E o mesmo
         motivo pelo qual os icones do Phosphor moram dentro do projeto. -->
    <link rel="stylesheet" href="css/tema.css" />
  </head>
  <body>
    <div id="raiz">
      <div class="carregando">Abrindo o atendimento do escritório</div>
    </div>
    <!-- Regiao viva: e por ela que o leitor de tela anuncia "Conversa excluida",
         "Chave copiada" e o resto dos avisos, que muitas vezes sao a unica
         confirmacao de uma acao que nao volta atras. -->
    <div class="avisos" id="avisos" role="status" aria-live="polite"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
