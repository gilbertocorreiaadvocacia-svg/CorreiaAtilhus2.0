# ---------------------------------------------------------------------
#  CorreiaAtilhus2.0 hospedado numa VPS. Guia passo a passo: HOSPEDAGEM.md
#
#  Quatro conteineres, numa rede so:
#    sistema    o CorreiaAtilhus2.0 (Dockerfile na raiz do projeto)
#    evolution  a Evolution API, que segura o WhatsApp por QR Code
#    postgres   o banco da Evolution
#    caddy      o HTTPS: pede e renova o certificado sozinho
#
#  So o caddy publica porta (80 e 443). O resto conversa pela rede interna:
#  nem o banco nem a Evolution ficam ao alcance da internet.
#
#  Os segredos moram em hospedagem/.env (modelo: .env.exemplo, ao lado).
#
#  Subir (desta pasta):   docker compose up -d --build
#  Ver o log:             docker compose logs -f sistema
#  Parar:                 docker compose down        (os dados ficam nos volumes)
# ---------------------------------------------------------------------

name: correia

services:
  sistema:
    build:
      context: ..
    restart: unless-stopped
    environment:
      CORREIA_HOSPEDADO: '1'
      # O endereco publico: Instagram e TikTok mandam as mensagens para ele.
      CORREIA_ENDERECO_PUBLICO: https://${DOMINIO:?defina DOMINIO no arquivo .env}
      CORREIA_ADMIN_EMAIL: ${CORREIA_ADMIN_EMAIL:-admin@correia.adv.br}
      CORREIA_ADMIN_SENHA: ${CORREIA_ADMIN_SENHA:?defina CORREIA_ADMIN_SENHA no arquivo .env}
      # A Evolution e o conteiner ao lado; a volta dos webhooks e este conteiner.
      CORREIA_EVOLUTION_URL: http://evolution:8080
      CORREIA_EVOLUTION_CHAVE: ${AUTHENTICATION_API_KEY:?defina AUTHENTICATION_API_KEY no arquivo .env}
      CORREIA_EVOLUTION_WEBHOOK: http://sistema:4477
      CORREIA_SUPABASE_URL: ${CORREIA_SUPABASE_URL:-}
      CORREIA_SUPABASE_CHAVE: ${CORREIA_SUPABASE_CHAVE:-}
    volumes:
      # Conversas, contatos, agentes, midia: tudo o que o notebook guardava em dados/.
      - dados:/dados
    depends_on:
      - evolution

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:?defina POSTGRES_SENHA no arquivo .env}
      POSTGRES_DB: evolution_db
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evolution -d evolution_db']
      interval: 5s
      timeout: 5s
      retries: 20

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    # As migracoes rodam na partida: sem o Postgres pronto, a primeira subida sai.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # A imagem vem com uma chave padrao PUBLICA; trocar nao e opcional.
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:?defina AUTHENTICATION_API_KEY no arquivo .env}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_SENHA}@postgres:5432/evolution_db?schema=evolution_api
      DATABASE_URL: postgresql://evolution:${POSTGRES_SENHA}@postgres:5432/evolution_db?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      CACHE_REDIS_ENABLED: 'false'
      CACHE_LOCAL_ENABLED: 'true'
      CONFIG_SESSION_PHONE_CLIENT: Correia Advogados
      CONFIG_SESSION_PHONE_NAME: Chrome
      SERVER_URL: http://evolution:8080
      TZ: America/Sao_Paulo
    volumes:
      # Sem este volume, a sessao do WhatsApp morre a cada reinicio e o QR Code
      # precisa ser lido de novo.
      - evolution_instancias:/evolution/instances

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no arquivo .env}
      EMAIL_HTTPS: ${EMAIL_HTTPS:?defina EMAIL_HTTPS no arquivo .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - sistema

volumes:
  # "correia_dados" no servidor. E ele que o backup.sh copia.
  dados:
  evolution_postgres:
  evolution_instancias:
  caddy_dados:
  caddy_config:
